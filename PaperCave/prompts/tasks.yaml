read:
  description: >
    Use the pdf_reader tool to read the file at '{pdf_path}'.
    Return the extracted text EXACTLY as the tool produced it —
    preserving all structural tags such as [SEGMENT N] or [FULL PAPER].
    Do not modify, summarize, or remove any markers.
  expected_output: >
    Full text of the scientific paper extracted from the PDF, including
    all sections (abstract, introduction, methodology, results, evaluation,
    conclusion, references) and all demarcation tags produced by the tool.

summarize:
  description: >
    Receive the full paper text extracted by the previous agent.
    Produce a structured summary using the 6 required blocks:
    CENTRAL CONTRIBUTION, PROBLEM AND CONTEXT, METHOD/SYSTEM,
    RESULTS AND METRICS, LIMITATIONS, KEY CONCEPTS.

    Scale the summary based on the paper's technical density
    (800-1200 words for dense methodological papers,
    400-600 for conceptual papers or surveys).
    Preserve all specific technical terms and quantitative data.
  expected_output: >
    Structured summary in 6 blocks, scaled to the paper's technical density,
    preserving technical terms, algorithms, tools, hardware, and numerical metrics.

analyze_images:
  description: >
    Receive the paper figures (already extracted as FIG_*.png files) with
    their captions from the paper. For each figure, produce a description of
    what it shows and how it relates to the paper's central contribution.
    If you have visual access to the image file, use mode="visual".
    If inferring from caption and context only, use mode="text_inferred".
    
    You must classify each figure under the field `visualType` using one of:
      - "photo_or_screenshot": Real-world photos, 3D avatars, or in-game/interface screenshots.
      - "chart_or_graph": Data charts (bar charts, line graphs, scatter plots) showing quantitative evaluation.
      - "diagram_or_flowchart": Abstract system architectures, network node topologies, or step-by-step algorithms.
      - "table_image": Raw grid tables printed as images.

    Return ONLY valid JSON following the ImageInsights schema.
  expected_output: >
    Valid JSON with insights for each figure:
    filename (e.g. "FIG1.png"), description (1-2 sentences),
    relevance (how it relates to the paper's contribution), mode, and visualType.

analyze_tables:
  description: >
    Receive the paper tables (already extracted as TAB_*.png files).
    For each table, produce a perfect Markdown transcription of its contents, capturing headers, rows, and columns accurately.
    Use the provided full text of the paper as context to resolve any ambiguous abbreviations or OCR issues in the table.
    
    Return ONLY valid JSON following the TableInsights schema.
  expected_output: >
    Valid JSON with transcriptions for each table:
    filename (e.g. "TAB1.png"), markdown_content (perfectly formatted markdown table).

extract:
  description: >
    Based on the paper summary provided by the previous agent,
    extract between 6 and 10 relevant conceptual elements following
    exactly the ExtractionResult schema.
    If the summary includes a VISUAL INSIGHTS block, factor it into
    the analysis.
    
    CRITICAL EXTRACTS:
    - You must extract exactly one "abstract" element containing a summary of the actual paper's abstract.
    - You must extract exactly one "contribution" element describing the actual main contribution of the paper.
    - Classify all other extracted elements under graphical_representation, image, graph, or table.
    - **Table Data Extraction**: If an element is a "table", you MUST read the paper text (or use your knowledge/search) to extract its actual headers and rows, and format them into the `data` field as: `{"columns": ["Col1", "Col2"], "rows": [["val1", "val2"], ["val3", "val4"]]}`. Do not leave the `data` field as null or empty for tables.
    - Order elements from most to least relevant.
    - Return ONLY valid JSON, no additional text, no markdown.
  expected_output: >
    Valid JSON with paperTitle, centralContribution, and a list of elements,
    each with name, category (abstract, contribution, graphical_representation, image, graph, table),
    description, relevanceScore, justification, groupingHint, and table data (for tables).

map:
  description: >
    Based on the extracted elements and the visual insights of the figures,
    produce a Unit Manifest organizing the elements and ALL figures into exactly up to 6 draggable units.

    REGRAS DE CONSTRUÇÃO DE UNIDADES:
    1. contribution (Tipo: "card", priority="primary", contentType="text_panel"):
       - A contribuição principal do paper. Esta deve ser a única unidade com priority="primary" no manifest inteiro.
    2. abstract (Tipo: "card", priority="secondary", contentType="text_panel"):
       - Resumo conciso do abstract real do paper.
    3. graphical_representation (Tipo: "card", priority="secondary", contentType="figure"):
       - O elemento visual (figura) mais importante de todo o paper (ex: o diagrama geral da arquitetura, pipeline ou interface principal).
       - Defina content.assetReference com o nome da figura correspondente (ex: FIG1). Esta figura deve ser excluída de qualquer outra stack abaixo.
    4. image (Tipo: "stack", priority="secondary", category="image"):
       - Stack contendo TODAS as figuras classificadas como "photo_or_screenshot" ou "diagram_or_flowchart" em ordem numérica sequencial. Exclua a figura usada em graphical_representation.
       - Cada item deve ter contentType="figure" e o seu assetReference.
    5. graph (Tipo: "stack", priority="secondary", category="graph"):
       - Stack contendo TODAS as figuras correspondentes aos gráficos (Figuras classificadas como "chart_or_graph") em ordem numérica sequencial.
       - Cada item deve ter contentType="figure" e o seu correspondente assetReference (ex: FIG3).
    6. table (Tipo: "stack", priority="secondary", category="table"):
       - Stack contendo TODAS as tabelas do paper (incluindo figuras classificadas como "table_image" ou tabelas descritas em texto) em ordem numérica sequencial.
       - Cada item deve ter contentType="table" e conter as colunas e linhas estruturadas copiando o campo `data` obtido do elemento correspondente do Extractor diretamente para `content.data`. Nunca use contentType="figure" para tabelas.

    REGRAS CRÍTICAS:
    - **Exaustividade de Figuras**: Todas as figuras listadas em available_figures devem ser mapeadas exatamente uma vez. Nenhuma figura pode ser deixada de fora.
    - **Ordem Sequencial**: Os itens dentro de qualquer stack (image, graph, table) devem seguir estritamente a ordem numérica original das figuras (ex: FIG1, FIG2, FIG3...).
    - **Limites de caracteres**:
      - title (cards) / stackLabel (stacks): máximo 30 caracteres.
      - summary (single cards only): máximo 80 caracteres.
      - description (para text_panel - Abstract e Contribution): máximo 500 caracteres (permita parágrafos completos, ricos e com profundidade metodológica).
      - description (para figure, graph ou table): máximo 200 caracteres (legendas curtas e objetivas).

    {available_figures}
    {asset_catalog_section}
    {visual_style_section}

    Retorne APENAS o JSON válido seguindo o schema UnitManifest.
  expected_output: >
    JSON válido contendo paperTitle, centralContribution, unitCount (quantidade de unidades geradas, máximo 6),
    e a lista de units seguindo exatamente as 6 categorias definidas.

review:
  description: >
    Evaluate the Unit Manifest provided by the previous agent.
    Assign a score (0.0 to 1.0) for each unit based on its grounding
    in the actual content of the paper. Keep the scores in the SAME ORDER as the
    units appear in the manifest, using each unit's title or stackLabel
    (or id) as suggestedName.
    If 2 or more units have score < 0.6, set approved=false and provide
    specific per-unit feedback to guide the retry.
    
    Verify that:
    - All available figures are represented.
    - Table stack items have structured data (columns and rows populated).
    - Titles are <= 30 characters and summaries <= 80 characters.
    Previous attempt history: {attempt_history}
    Current attempt: {current_attempt}
    Return ONLY valid JSON following the ReviewResult schema.
  expected_output: >
    Valid JSON with attempt, approved, objectScores (score, confidence, feedback
    for each unit), and overallFeedback.
